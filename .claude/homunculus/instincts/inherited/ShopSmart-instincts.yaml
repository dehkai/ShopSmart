# ShopSmart Workflow Frontend Feature Or Page Revamp

## Action

Follow the frontend-feature-or-page-revamp workflow:
1. Update or create relevant page files in src/app (e.g., page.tsx).
2. Modify or add UI components in src/components (e.g., basket, results, ui subfolders).
3. Update related hooks in src/hooks (e.g., useBasket.ts).
4. Adjust global styles in src/app/globals.css as needed.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: frontend/src/app/page.tsx, frontend/src/app/globals.css, frontend/src/components/basket/BasketInput.tsx

