[project]
name = "week-4-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "google-genai==2.3.0",
    "ollama==0.6.2",
    "python-dotenv==1.2.2",
    "pydantic==2.12.4",
    "rapidfuzz==3.14.1",
    "pandas==3.0.3",
    "fastparquet==2024.11.0",
    "groq==1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0,<0.16.0",
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"
