[project]
name = "week-4-frontend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0,<0.16.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"
