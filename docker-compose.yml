services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
    environment:
      - GEMINI_API=${GEMINI_API:-}
    networks:
      - shopsmart

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=${BACKEND_URL}
    depends_on:
      - backend
    networks:
      - shopsmart

networks:
  shopsmart:
    driver: bridge
